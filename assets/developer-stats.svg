<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 155" width="100%" height="100%">
  <!-- Card Background -->
  <rect width="440" height="155" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" />

  <!-- Card Title -->
  <text x="22" y="28" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">SomayLab's Engineering Stats</text>

  <!-- Left Stats Rows -->
  <!-- Row 1: Total Repos -->
  <g transform="translate(22, 45)">
    <path fill="#58A6FF" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z" />
    <text x="24" y="11" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Total Projects:</text>
    <text x="135" y="11" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">11 Repositories</text>
  </g>

  <!-- Row 2: Private & Public -->
  <g transform="translate(22, 69)">
    <path fill="#58A6FF" d="M1.75 1.5a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25H1.75ZM0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25V1.75Z" />
    <text x="24" y="11" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Ecosystem Split:</text>
    <text x="135" y="11" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">5 Public / 6 Private</text>
  </g>

  <!-- Row 3: Platforms -->
  <g transform="translate(22, 93)">
    <path fill="#58A6FF" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Z" />
    <text x="24" y="11" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Core Stacks:</text>
    <text x="135" y="11" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Rust, PHP, TS, Python</text>
  </g>

  <!-- Row 4: Telemetry -->
  <g transform="translate(22, 117)">
    <path fill="#10B981" d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z" />
    <text x="24" y="11" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Data Sovereignty:</text>
    <text x="135" y="11" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">100% Offline / Local</text>
  </g>

  <!-- Right Circular Metric: Real Commits Gauge -->
  <g transform="translate(355, 82)">
    <!-- Outer Ring Track -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#21262D" stroke-width="4.5" />
    <!-- Progress Arc in Cyan -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-dasharray="215 240" stroke-linecap="round" transform="rotate(-90)" />
    <!-- Center Metric Numbers -->
    <text x="0" y="5" fill="#F1F5F9" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="18" font-weight="900" text-anchor="middle">750+</text>
    <text x="0" y="21" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="8.5" font-weight="700" text-anchor="middle">COMMITS</text>
  </g>
